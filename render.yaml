services:
  - type: web
    name: procura-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procura-db
          property: connectionString
      - key: REDIS_URL
        value: "redis://procura-redis:6379/0"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: procura-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: "https://procura-backend.onrender.com/api/v1"

  - type: pserv
    name: procura-redis
    env: docker
    repo: https://github.com/render-examples/redis.git
    branch: master

databases:
  - name: procura-db
    databaseName: rfq_enterprise_db
    user: rfq_admin
    plan: free
